name: LingTong Vision
run-name: 打包 ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]            # 打 v1.2.5 这样的标签 → 自动构建并发布 Release
  workflow_dispatch:        # 也可以在 Actions 页面手动触发（只产出构建产物）

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------- Windows
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 确定版本号
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"
          else
            V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' core/__init__.py)
          fi
          echo "v=${V#v}" >> "$GITHUB_OUTPUT"

      - name: PyInstaller 打包
        env:
          LINGTONG_ICON: assets/icons/app.ico
          LINGTONG_VERSION: ${{ steps.ver.outputs.v }}
        run: python -m PyInstaller LingTong.spec --noconfirm --clean

      - name: 组装发布包
        run: python tools/make_release.py --version ${{ steps.ver.outputs.v }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: LingTong-v${{ steps.ver.outputs.v }}-win64
          path: release/LingTong-v${{ steps.ver.outputs.v }}-win64.zip

  # ---------------------------------------------------------------- macOS
  build-macos:
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 确定版本号
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"
          else
            V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' core/__init__.py)
          fi
          echo "v=${V#v}" >> "$GITHUB_OUTPUT"

      - name: PyInstaller 打包
        env:
          LINGTONG_ICON: assets/icons/app.icns
          LINGTONG_VERSION: ${{ steps.ver.outputs.v }}
        run: python -m PyInstaller LingTong.spec --noconfirm --clean

      - name: 组装发布包
        run: python tools/make_release.py --version ${{ steps.ver.outputs.v }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: LingTong-v${{ steps.ver.outputs.v }}-macos
          path: release/LingTong-v${{ steps.ver.outputs.v }}-macos.tar.gz

  # ---------------------------------------------------------------- Release
  release:
    # 只有打标签推送时才创建 GitHub Release；手动触发只保留构建产物
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip artifacts/*.tar.gz
          generate_release_notes: true
